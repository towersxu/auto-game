<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>城市领土 Demo – Auto Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px 20px;
      background: #16213e;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; }
    header a {
      color: #a0aec0;
      font-size: 0.85rem;
      text-decoration: none;
    }
    header a:hover { color: #fff; }
    #legend {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 0.8rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }
    #status {
      margin-left: auto;
      font-size: 0.85rem;
      color: #68d391;
      min-width: 200px;
    }
    #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #map-container canvas {
      width: 100% !important;
      height: 100% !important;
    }
    #controller-wrap {
      position: absolute;
      bottom: 24px;
      right: 24px;
    }
  </style>
  <script type="module" crossorigin src="/auto-game/32/assets/cityTerritoryDemo-BA4W9t1G.js"></script>
  <link rel="modulepreload" crossorigin href="/auto-game/32/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/auto-game/32/assets/map-controller-CQYEU65r.js">
</head>
<body>
  <header>
    <a href="./">← 返回首页</a>
    <h1>🏙 城市领土 Demo</h1>
    <div id="legend">
      <div class="legend-item">
        <div class="legend-swatch" style="background:#ff6b35"></div>
        <span>City 1</span>
      </div>
      <div class="legend-item">
        <div class="legend-swatch" style="background:#4ecdc4"></div>
        <span>City 2</span>
      </div>
    </div>
    <span id="status">点击与城市相邻的地块以扩展领土</span>
  </header>
  <div id="map-container">
    <div id="controller-wrap"></div>
  </div>
</body>
</html>
