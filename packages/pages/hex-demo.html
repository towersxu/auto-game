<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>六边形地图 Demo – Auto Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; letter-spacing: 0.03em; }
    header a { color: #58a6ff; font-size: 0.82rem; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    #hint { font-size: 0.78rem; color: #8b949e; margin-left: auto; }

    #map-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #map-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* HUD overlay */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(13, 17, 23, 0.78);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.76rem;
      line-height: 1.7;
      min-width: 180px;
      pointer-events: none;
    }
    #hud strong { color: #58a6ff; }
    #hud .label { color: #8b949e; }

    /* Controller panel */
    #controller-wrap {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .ctrl-group {
      display: inline-grid;
      grid-template-columns: repeat(3, 38px);
      grid-template-rows: repeat(3, 38px);
      gap: 3px;
    }
    .ctrl-btn {
      width: 38px; height: 38px;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: rgba(22, 27, 34, 0.9);
      color: #e6edf3;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      user-select: none;
    }
    .ctrl-btn:hover  { background: #21262d; }
    .ctrl-btn:active { background: #388bfd33; }
    .ctrl-btn.wide {
      grid-column: span 3;
      width: 100%;
    }

    /* Legend */
    #legend {
      position: absolute;
      bottom: 20px;
      left: 12px;
      background: rgba(13, 17, 23, 0.78);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.74rem;
      line-height: 2;
      pointer-events: none;
    }
    .legend-row { display: flex; align-items: center; gap: 8px; }
    .legend-swatch {
      width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <a href="./">← 返回首页</a>
    <h1>🗺 六边形地图 Demo</h1>
    <span id="hint">
      鼠标拖动平移 · 滚轮缩放 · 右下角控制器 · 点击「揭开迷雾」探索地图
    </span>
  </header>

  <div id="map-container">
    <!-- HUD -->
    <div id="hud">
      <div><span class="label">悬停格：</span><strong id="hud-cell">—</strong></div>
      <div><span class="label">地形层：</span><strong id="hud-tier">—</strong></div>
      <div><span class="label">迷雾状态：</span><strong id="hud-fog">—</strong></div>
    </div>

    <!-- Terrain legend -->
    <div id="legend">
      <div class="legend-row">
        <div class="legend-swatch" style="background:#1a5e9a"></div>水下层（Submerged）
      </div>
      <div class="legend-row">
        <div class="legend-swatch" style="background:#2d6a2d"></div>平原层（Baseland）
      </div>
      <div class="legend-row">
        <div class="legend-swatch" style="background:#7a6030"></div>丘陵层（Elevated）
      </div>
      <div class="legend-row">
        <div class="legend-swatch" style="background:#8a8a90"></div>山脉层（Peak）
      </div>
      <div class="legend-row">
        <div class="legend-swatch" style="background:#3a8fd9"></div>河流（River edge）
      </div>
    </div>

    <!-- Controller -->
    <div id="controller-wrap">
      <div class="ctrl-group" id="ctrl-grid"></div>
      <button class="ctrl-btn wide" id="btn-reveal" style="width:120px;height:34px;font-size:13px;">
        🔭 揭开迷雾
      </button>
      <button class="ctrl-btn wide" id="btn-reveal-all" style="width:120px;height:34px;font-size:13px;">
        🌐 显示全图
      </button>
    </div>
  </div>

  <script type="module" src="./src/hex-demo.ts"></script>
</body>
</html>
